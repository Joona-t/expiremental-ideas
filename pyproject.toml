[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blitz-swarm"
version = "0.1.0"
description = "CLI-first blackboard swarm runtime for research synthesis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "aiosqlite>=0.20",
  "deepdiff>=8.0",
  "httpx>=0.27",
  "lancedb>=0.17",
  "networkx>=3.3",
  "pydantic>=2.8",
  "redis>=5.0",
  "typer>=0.12",
]

[project.scripts]
blitz = "blitz_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blitz_swarm"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]
